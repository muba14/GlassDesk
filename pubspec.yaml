name: glassdesk
description: "GlassDesk - masaüstünde yüzen, cam efektli widget'lar (saat, takvim, sistem, hava durumu, notlar)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  window_manager: ^0.5.0
  flutter_acrylic: ^1.1.4
  path_provider: ^2.1.4
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
